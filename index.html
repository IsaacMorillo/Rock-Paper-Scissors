<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-Scissors</title>
  </head>
  <body>
    <div class="opcion-Container">
      <img src="./images/puno-cerrado.png" alt="icono-rock" />
      <button class="playerChoice" id="rock">Rock</button>
    </div>
    <div class="opcion-Container">
      <img src="./images/papel-de-mano.png" alt="icono-paper" />
      <button class="playerChoice" id="paper">Paper</button>
    </div>
    <div class="opcion-Container">
      <img src="./images/tijeras.png" alt="icon-scissors" />
      <button class="playerChoice" id="scissors">Scissors</button>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
