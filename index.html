<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Rock-Paper-Scissors</title>
  </head>
  <body>
    <h1>Rock - Paper - Scissors</h1>
    <p id="info">The first to score 5 points wins</p>
    <div class="scoreContainer">
      <div class="score">
        <p id="playerName">PLAYER</p>
        <p id="playerScore">0</p>
      </div>
      <div class="score">
        <p id="CPUName">CPU</p>
        <p id="cpuScore">0</p>
      </div>
    </div>
    <h2>Round <span id="number-round">1</span></h2>
    <h3>Choose!!</h3>
    <div class="options">
      <div class="opcion-Container" id="rock">
        <img src="./images/puno-cerrado.png" alt="icono-rock" />
        <p class="playerChoice">Rock</p>
      </div>
      <div class="opcion-Container" id="paper">
        <img src="./images/papel-de-mano.png" alt="icono-paper" />
        <p class="playerChoice">Paper</p>
      </div>
      <div class="opcion-Container" id="scissors">
        <img src="./images/tijeras.png" alt="icon-scissors" />
        <p class="playerChoice">Scissors</p>
      </div>
    </div>
    <div class="info-game"></div>
    <script src="./main.js"></script>
  </body>
</html>
